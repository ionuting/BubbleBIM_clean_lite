<?xml version="1.0" encoding="UTF-8"?>
<!-- BubbleGraph — Window Fix 60×60 cm — Top View (Plan) — dimensions in mm -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640.0 240.0" width="640.0" height="240.0">
  <style>
    text { font-family: monospace; font-size: 8px; fill: #334155; }
    .frame { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; }
    .glass { fill: #bae6fd; stroke: #0ea5e9; stroke-width: 0.8; opacity: 0.7; }
    .dim   { stroke: #94a3b8; stroke-width: 0.5; fill: none; stroke-dasharray: 3 2; }
    .label { fill: #64748b; font-size: 7px; }
  </style>
  <!-- Frame outline -->
  <rect class="frame" x="20" y="20" width="600.0" height="200.0" rx="1"/>
  <!-- Glass infill -->
  <rect class="glass" x="50" y="28" width="540.0" height="184.0" rx="1"/>
  <!-- Dimension lines -->
  <line class="dim" x1="20" y1="12" x2="620.0" y2="12"/>
  <text x="320.0" y="10" text-anchor="middle" class="label">600.0 mm</text>
  <line class="dim" x1="628.0" y1="20" x2="628.0" y2="220.0"/>
  <text x="632.0" y="120.0" text-anchor="start" class="label">200.0 mm</text>
  <!-- Title -->
  <text x="20" y="236.0" class="label">Window Fix 60×60 cm — TOP VIEW</text>
</svg>

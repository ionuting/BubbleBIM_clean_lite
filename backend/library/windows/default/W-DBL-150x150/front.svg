<?xml version="1.0" encoding="UTF-8"?>
<!-- BubbleGraph — Window Double 150×150 cm — Front Elevation — dimensions in mm -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1540.0 1540.0" width="1540.0" height="1540.0">
  <style>
    text { font-family: monospace; font-size: 8px; fill: #334155; }
    .frame { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; }
    .glass { fill: #bae6fd; stroke: #0ea5e9; stroke-width: 0.8; opacity: 0.7; }
    .sill  { stroke: #78716c; stroke-width: 1.5; fill: none; }
    .dim   { stroke: #94a3b8; stroke-width: 0.5; fill: none; stroke-dasharray: 3 2; }
    .label { fill: #64748b; font-size: 7px; }
  </style>
  <!-- Frame -->
  <rect class="frame" x="20" y="20" width="1500.0" height="1500.0" rx="1"/>
  <!-- Glass panel (inside frame by 30 mm each side) -->
  <rect class="glass" x="50" y="50" width="1440.0" height="1440.0" rx="1"/>
  <!-- Sill line -->
  <line class="sill" x1="20" y1="620.0" x2="1520.0" y2="620.0"/>
  <!-- Width dimension -->
  <line class="dim" x1="20" y1="12" x2="1520.0" y2="12"/>
  <text x="770.0" y="10" text-anchor="middle" class="label">1500.0 mm</text>
  <!-- Height dimension -->
  <line class="dim" x1="1528.0" y1="20" x2="1528.0" y2="1520.0"/>
  <text x="1532.0" y="770.0" text-anchor="start" class="label">1500.0 mm</text>
  <!-- Title -->
  <text x="20" y="1536.0" class="label">Window Double 150×150 cm — FRONT ELEVATION</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- BubbleGraph — Gothic Window 60×180 cm — Front Elevation — dimensions in mm -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640.0 1840.0" width="640.0" height="1840.0">
  <style>
    text { font-family: monospace; font-size: 8px; fill: #334155; }
    .frame { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; }
    .glass { fill: #bae6fd; stroke: #0ea5e9; stroke-width: 0.8; opacity: 0.7; }
    .sill  { stroke: #78716c; stroke-width: 1.5; fill: none; }
    .dim   { stroke: #94a3b8; stroke-width: 0.5; fill: none; stroke-dasharray: 3 2; }
    .label { fill: #64748b; font-size: 7px; }
  </style>
  <!-- Frame -->
  <rect class="frame" x="20" y="20" width="600.0" height="1800.0" rx="1"/>
  <!-- Glass panel (inside frame by 30 mm each side) -->
  <rect class="glass" x="50" y="50" width="540.0" height="1740.0" rx="1"/>
  <!-- Sill line -->
  <line class="sill" x1="20" y1="620.0" x2="620.0" y2="620.0"/>
  <!-- Width dimension -->
  <line class="dim" x1="20" y1="12" x2="620.0" y2="12"/>
  <text x="320.0" y="10" text-anchor="middle" class="label">600.0 mm</text>
  <!-- Height dimension -->
  <line class="dim" x1="628.0" y1="20" x2="628.0" y2="1820.0"/>
  <text x="632.0" y="920.0" text-anchor="start" class="label">1800.0 mm</text>
  <!-- Title -->
  <text x="20" y="1836.0" class="label">Gothic Window 60×180 cm — FRONT ELEVATION</text>
</svg>

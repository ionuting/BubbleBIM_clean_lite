<?xml version="1.0" encoding="UTF-8"?>
<!-- BubbleGraph — Gothic Window 60×180 cm — Vertical Section — dimensions in mm -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 340.0 1840.0" width="340.0" height="1840.0">
  <style>
    text { font-family: monospace; font-size: 8px; fill: #334155; }
    .frame { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; }
    .glass { fill: #bae6fd; stroke: #0ea5e9; stroke-width: 0.8; opacity: 0.7; }
    .sill  { fill: #d6d3d1; stroke: #78716c; stroke-width: 1; }
    .dim   { stroke: #94a3b8; stroke-width: 0.5; fill: none; stroke-dasharray: 3 2; }
    .label { fill: #64748b; font-size: 7px; }
  </style>
  <!-- Left frame profile -->
  <rect class="frame" x="20" y="20" width="70" height="1800.0"/>
  <!-- Right frame profile -->
  <rect class="frame" x="250.0" y="20" width="70" height="1800.0"/>
  <!-- Glass -->
  <rect class="glass" x="90" y="50" width="160.0" height="1740.0"/>
  <!-- Sill -->
  <rect class="sill" x="20" y="620.0" width="300.0" height="40"/>
  <!-- Depth dimension -->
  <line class="dim" x1="20" y1="12" x2="320.0" y2="12"/>
  <text x="170.0" y="10" text-anchor="middle" class="label">300.0 mm</text>
  <!-- Height dimension -->
  <line class="dim" x1="328.0" y1="20" x2="328.0" y2="1820.0"/>
  <text x="332.0" y="920.0" text-anchor="start" class="label">1800.0 mm</text>
  <!-- Title -->
  <text x="20" y="1836.0" class="label">Gothic Window 60×180 cm — SECTION</text>
</svg>

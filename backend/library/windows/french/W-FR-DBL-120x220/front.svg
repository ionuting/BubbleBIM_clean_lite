<?xml version="1.0" encoding="UTF-8"?>
<!-- BubbleGraph — French Door-Window 120×220 cm — Front Elevation — dimensions in mm -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1240.0 2240.0" width="1240.0" height="2240.0">
  <style>
    text { font-family: monospace; font-size: 8px; fill: #334155; }
    .frame { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; }
    .glass { fill: #bae6fd; stroke: #0ea5e9; stroke-width: 0.8; opacity: 0.7; }
    .sill  { stroke: #78716c; stroke-width: 1.5; fill: none; }
    .dim   { stroke: #94a3b8; stroke-width: 0.5; fill: none; stroke-dasharray: 3 2; }
    .label { fill: #64748b; font-size: 7px; }
  </style>
  <!-- Frame -->
  <rect class="frame" x="20" y="20" width="1200.0" height="2200.0" rx="1"/>
  <!-- Glass panel (inside frame by 30 mm each side) -->
  <rect class="glass" x="50" y="50" width="1140.0" height="2140.0" rx="1"/>


  <!-- Width dimension -->
  <line class="dim" x1="20" y1="12" x2="1220.0" y2="12"/>
  <text x="620.0" y="10" text-anchor="middle" class="label">1200.0 mm</text>
  <!-- Height dimension -->
  <line class="dim" x1="1228.0" y1="20" x2="1228.0" y2="2220.0"/>
  <text x="1232.0" y="1120.0" text-anchor="start" class="label">2200.0 mm</text>
  <!-- Title -->
  <text x="20" y="2236.0" class="label">French Door-Window 120×220 cm — FRONT ELEVATION</text>
</svg>

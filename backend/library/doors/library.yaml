# doors/library.yaml
# ─────────────────────────────────────────────────────────────────────────────
# BubbleGraph BIM — Door Element Library
# Human-editable catalogue; served by backend at GET /api/library/door
#
# To add a custom door type, append an entry to the `entries` list.
# Drop any matching geometry assets (IFC, SVG) into:
#   backend/library/doors/<style>/<id>/
# ─────────────────────────────────────────────────────────────────────────────

family: door
version: "1.1.0"
description: "Door element catalogue — all styles"

entries:
  # ── default style ────────────────────────────────────────────────────────
  - id: D-SWING-80x210
    label: "Door Swing 80×210 cm"
    style: default
    width_mm: 800
    height_mm: 2100
    sill_height_mm: 0
    depth_mm: 200
    leaf_count: 1
    swing: left
    material: "Lemn stejar"
    description: "Ușă batantă stânga 800×2100 mm"
    library_path: "doors/default/D-SWING-80x210"

  - id: D-SWING-90x210
    label: "Door Swing 90×210 cm"
    style: default
    width_mm: 900
    height_mm: 2100
    sill_height_mm: 0
    depth_mm: 200
    leaf_count: 1
    swing: right
    material: "Lemn stejar"
    description: "Ușă batantă dreapta 900×2100 mm"
    library_path: "doors/default/D-SWING-90x210"

  - id: D-DBL-120x210
    label: "Door Double 120×210 cm"
    style: default
    width_mm: 1200
    height_mm: 2100
    sill_height_mm: 0
    depth_mm: 200
    leaf_count: 2
    swing: double
    material: "Lemn stejar"
    description: "Ușă dublă batantă 1200×2100 mm"
    library_path: "doors/default/D-DBL-120x210"

  - id: D-SLD-90x210-IFC
    label: "Door Sliding 90×210 cm (IFC)"
    style: default
    width_mm: 900
    height_mm: 2100
    sill_height_mm: 0
    depth_mm: 200
    leaf_count: 1
    swing: sliding
    material: "Sticlă / Aluminiu"
    description: "Ușă glisantă 900×2100 mm — model IFC"
    library_path: "doors/default/D-SLD-90x210-IFC"
    ifc_path: "doors/default/D-SLD-90x210-IFC/D-SLD-90x210-IFC.ifc"

  - id: D-SLD-100x210
    label: "Door Sliding 100×210 cm"
    style: default
    width_mm: 1000
    height_mm: 2100
    sill_height_mm: 0
    depth_mm: 200
    leaf_count: 1
    swing: sliding
    material: "Sticlă / Aluminiu"
    description: "Ușă glisantă 1000×2100 mm"
    library_path: "doors/default/D-SLD-100x210"

  - id: D-SLD-200x210
    label: "Door Sliding 200×210 cm"
    style: default
    width_mm: 2000
    height_mm: 2100
    sill_height_mm: 0
    depth_mm: 200
    leaf_count: 2
    swing: sliding
    material: "Sticlă / Aluminiu"
    description: "Ușă glisantă dublă 2000×2100 mm"
    library_path: "doors/default/D-SLD-200x210"

  # ── french style ─────────────────────────────────────────────────────────
  - id: D-FR-DBL-120x240
    label: "French Door Double 120×240 cm"
    style: french
    width_mm: 1200
    height_mm: 2400
    sill_height_mm: 0
    depth_mm: 200
    leaf_count: 2
    swing: double
    material: "Lemn vopsit alb"
    description: "Ușă franceză dublă 1200×2400 mm"
    library_path: "doors/french/D-FR-DBL-120x240"

  - id: D-FR-SNG-90x240
    label: "French Door Single 90×240 cm"
    style: french
    width_mm: 900
    height_mm: 2400
    sill_height_mm: 0
    depth_mm: 200
    leaf_count: 1
    swing: right
    material: "Lemn vopsit alb"
    description: "Ușă franceză simplă 900×2400 mm"
    library_path: "doors/french/D-FR-SNG-90x240"

  # ── gothic style ─────────────────────────────────────────────────────────
  - id: D-GT-DBL-140x280
    label: "Gothic Door Double 140×280 cm"
    style: gothic
    width_mm: 1400
    height_mm: 2800
    sill_height_mm: 0
    depth_mm: 350
    leaf_count: 2
    swing: double
    material: "Stejar masiv / Fier forjat"
    description: "Ușă gotică dublă arc frânt 1400×2800 mm"
    library_path: "doors/gothic/D-GT-DBL-140x280"

  # ── Add your custom door types below ─────────────────────────────────────
  # Example:
  # - id: D-CUSTOM-90x210
  #   label: "Custom Door 90×210 cm"
  #   style: default
  #   width_mm: 900
  #   height_mm: 2100
  #   sill_height_mm: 0
  #   depth_mm: 200
  #   leaf_count: 1
  #   swing: right
  #   material: "Aluminiu"
  #   description: "Ușă personalizată"
  #   library_path: "doors/default/D-CUSTOM-90x210"

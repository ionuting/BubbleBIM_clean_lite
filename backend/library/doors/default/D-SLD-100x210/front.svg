<?xml version="1.0" encoding="UTF-8"?>
<!-- BubbleGraph — Door Sliding 100×210 cm — Front Elevation — dimensions in mm -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1040.0 2140.0" width="1040.0" height="2140.0">
  <style>
    text { font-family: monospace; font-size: 8px; fill: #334155; }
    .frame { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; }
    .glass { fill: #bae6fd; stroke: #0ea5e9; stroke-width: 0.8; opacity: 0.7; }
    .sill  { stroke: #78716c; stroke-width: 1.5; fill: none; }
    .dim   { stroke: #94a3b8; stroke-width: 0.5; fill: none; stroke-dasharray: 3 2; }
    .label { fill: #64748b; font-size: 7px; }
  </style>
  <!-- Frame -->
  <rect class="frame" x="20" y="20" width="1000.0" height="2100.0" rx="1"/>
  <!-- Glass panel (inside frame by 30 mm each side) -->
  <rect class="glass" x="50" y="50" width="940.0" height="2040.0" rx="1"/>


  <!-- Width dimension -->
  <line class="dim" x1="20" y1="12" x2="1020.0" y2="12"/>
  <text x="520.0" y="10" text-anchor="middle" class="label">1000.0 mm</text>
  <!-- Height dimension -->
  <line class="dim" x1="1028.0" y1="20" x2="1028.0" y2="2120.0"/>
  <text x="1032.0" y="1070.0" text-anchor="start" class="label">2100.0 mm</text>
  <!-- Title -->
  <text x="20" y="2136.0" class="label">Door Sliding 100×210 cm — FRONT ELEVATION</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- BubbleGraph — Gothic Door Double 140×280 cm — Top View (Plan) — dimensions in mm -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1440.0 390.0" width="1440.0" height="390.0">
  <style>
    text { font-family: monospace; font-size: 8px; fill: #334155; }
    .frame { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; }
    .glass { fill: #bae6fd; stroke: #0ea5e9; stroke-width: 0.8; opacity: 0.7; }
    .dim   { stroke: #94a3b8; stroke-width: 0.5; fill: none; stroke-dasharray: 3 2; }
    .label { fill: #64748b; font-size: 7px; }
  </style>
  <!-- Frame outline -->
  <rect class="frame" x="20" y="20" width="1400.0" height="350.0" rx="1"/>
  <!-- Glass infill -->
  <rect class="glass" x="50" y="28" width="1340.0" height="334.0" rx="1"/>
  <!-- Dimension lines -->
  <line class="dim" x1="20" y1="12" x2="1420.0" y2="12"/>
  <text x="720.0" y="10" text-anchor="middle" class="label">1400.0 mm</text>
  <line class="dim" x1="1428.0" y1="20" x2="1428.0" y2="370.0"/>
  <text x="1432.0" y="195.0" text-anchor="start" class="label">350.0 mm</text>
  <!-- Title -->
  <text x="20" y="386.0" class="label">Gothic Door Double 140×280 cm — TOP VIEW</text>
</svg>

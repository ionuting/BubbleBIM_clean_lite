<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BubbleGraph — Visual Building Editor</title>
  <script>
    (function() {
      // The shell's theme (Studio Night by default) — the key the theme toggle writes.
      var saved = localStorage.getItem('bubblebim_clean_theme') || localStorage.getItem('bubble-graph-theme');
      var theme = saved || 'dark';
      if (theme === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <!-- Shell typefaces; offline, the system fonts in each stack stand in. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
</head>
<body class="bg-background text-foreground">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
